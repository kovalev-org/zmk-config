CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_EXT_POWER=y

# PMW3610 trackball — community driver (mochukeeb/zmk-pmw3610-driver, pinned
# in config/west.yml). This driver takes ALL its tuning from Kconfig (the
# native pixart,pmw3610 driver used devicetree properties instead). The values
# below are copied verbatim from kristijanribaric/zmk-config-Keyball39, whose
# trackball tracks correctly on identical hardware.
CONFIG_PMW3610=y
CONFIG_PM_DEVICE=y
CONFIG_PMW3610_PM=y
# CPI_DIVIDOR=1: the driver emits raw counts at full 1200 CPI without dividing.
# The ÷4 that sets the effective ~300 CPI is instead done per-axis in the input
# listener (keyball39_right.overlay) with track-remainders — the driver's own
# division is lossy integer math (no remainder tracking), which made slow
# vertical motion step in coarse jumps once we boosted the weak Y axis. Moving
# the scaling to the listener keeps both axes smooth at full 1-count
# granularity. (Snipe mode is unused — no snipe-layers — so SNIPE_CPI_DIVIDOR
# is left at 4.)
CONFIG_PMW3610_CPI=1200
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_SNIPE_CPI=400
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
# 180° mount orientation (this driver's convention for the Keyball trackball).
# NOTE: the old native-driver overlay used a 90° axis swap + invert-x; that was
# specific to the native driver's axis convention and does NOT carry over. If
# after flashing the cursor axes feel swapped or mirrored, flip these:
# CONFIG_PMW3610_ORIENTATION_{0,90,180,270} and/or CONFIG_PMW3610_INVERT_{X,Y}.
CONFIG_PMW3610_ORIENTATION_180=y
# Scroll behaviour (used on the Nav layer via scroll-layers = <2>). SCROLL_TICK
# is the movement needed per wheel notch; INVERT_SCROLL_X gives natural-
# direction horizontal scrolling.
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
# Smart algorithm ON (datasheet surface-coverage enhancement). The native
# driver's equivalent "smart-mode" was deliberately OFF in the old config, but
# the reference build runs this driver's smart algorithm and tracks well, so
# match it exactly.
CONFIG_PMW3610_SMART_ALGORITHM=y
# Power / sample-rate timings (verbatim from the reference).
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_POLLING_RATE_125_SW=y
# These two only take effect when a DT `automouse-layer` is set, which we do NOT
# do (auto-mouse is handled by &zip_temp_layer in keyball39_right.overlay — the
# driver's built-in automouse calls the pre-2-arg zmk_keymap_layer_activate()
# that no longer matches ZMK main). Kept to mirror the reference; currently inert.
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Custom status screen for the OLED label-flash feature on &totp. Replaces
# upstream's layer-status widget with our layer-or-TOTP variant
# (widget_layer_or_totp.c) wired into a custom screen (status_screen_custom.c).
#
# Switching from BUILT_IN to CUSTOM drops the `imply`/`select` chain that
# BUILT_IN provides for the per-widget Kconfigs, LV_USE_LABEL, LV_USE_THEME_MONO,
# and crucially LV_Z_MEM_POOL_SIZE — without the 4 KB pool size set explicitly,
# LVGL's default pool is tiny, lv_label_create() returns NULL inside the widget
# init, and the resulting NULL deref hard-faults the right half before USB or
# BLE come up (symptom: OLED shows uninitialised SSD1306 noise, left half
# can't pair). All of these are re-enabled here.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_Z_MEM_POOL_SIZE=4096
