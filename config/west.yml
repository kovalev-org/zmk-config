# This file specifies the build dependencies for Github Action workflows and
# for local build environments. The workspace has four toplevel directories
# containing the user config, modules, zephy and ZMK.
#
# ZMK-Workspace
# ├── config
# ├── modules
# ├── zephyr
# └── zmk
#
# To create a local build environment, clone this repository and then run the
# following commands from its toplevel directory:
#
# $ west init -l config
# $ west update
# $ west zephyr-export
#
---
manifest:
  defaults:
    remote: urob
    # revision: v0.3 # Pin ZMK version

  remotes:
    - name: urob
      url-base: https://github.com/urob
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
    - name: mochukeeb
      url-base: https://github.com/mochukeeb

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: 0331b7d16e80954b807917f9323e59ffc1e3b626 # main (4/19/2026)
      import: app/west.yml

    # nanopb lives in zephyr's `optional` group, which is disabled by zephyr's
    # group-filter. ZMK Studio's RPC layer hard-`select`s NANOPB, so we pull it
    # in directly. Revision tracks zephyr/submanifests/optional.yaml.
    - name: nanopb
      remote: zephyrproject-rtos
      revision: 7307ce399b81ddcb3c3a5dc862c52d4754328d38
      path: modules/lib/nanopb

    # ZMK modules
    - name: zmk-adaptive-key
      path: modules/zmk/adaptive-key
      revision: 18cc2795a64ccb394d1a7b7d591a5bfe3f25924b # main (4/19/2026)
    - name: zmk-auto-layer
      path: modules/zmk/auto-layer
      revision: dfa7c695ffde41ef8064245453595d50e198ae1d # main (4/19/2026)
    - name: zmk-helpers
      path: modules/zmk/helpers
      revision: 0b9e9d1dd9e86f70b4c8c2b0fab55c4f90c9d2e3 # main (4/19/2026)
    - name: zmk-leader-key
      path: modules/zmk/leader-key
      revision: 749f7faf65cc4105c82fbe64cfaa7e09a8a63605 # main (4/19/2026)
    - name: zmk-tri-state
      path: modules/zmk/tri-state
      revision: 2007896c6d5bfb519e8babccf8633841c5647d8b # main (4/19/2026)
    - name: zmk-unicode
      path: modules/zmk/unicode
      revision: 1a6dbc797a46c4a61c3c71a7a9d013a5d5aee49e # main (4/19/2026)

    # Community PMW3610 trackball driver (ufan → inorichi → mochukeeb lineage),
    # the exact driver used by kristijanribaric/zmk-config-Keyball39 whose
    # trackball tracks correctly. Replaces Zephyr 4.1's native pixart,pmw3610
    # driver — see keyball39_right.overlay/.conf. It uses the modern
    # input_report_rel + zmk,input-listener architecture, so it builds against
    # ZMK main UNMODIFIED, provided we do NOT set `automouse-layer` on the DT
    # node: that feature calls the pre-2-arg zmk_keymap_layer_activate() which
    # no longer matches ZMK main's `(layer, bool locking)` signature. We keep
    # auto-mouse via `&zip_temp_layer` in the input listener instead, so that
    # code path is #if'd out and never compiled. Pinned to current main (single
    # commit as of 2026-06-30) for reproducibility.
    - name: zmk-pmw3610-driver
      remote: mochukeeb
      path: modules/zmk/pmw3610-driver
      revision: 77a61804cf0d51a495a22e60d1a3115568a441df

    # Only source necessary Zephyr modules. Remove this entire section to restore
    # the default (needed for less common hardware).
    - name: zephyr
      remote: zmkfirmware
      revision: 58a5874a446ace2893a196848282d271a551e512 # v4.1.0+zmk-fixes
      clone-depth: 1
      import:
        name-allowlist:
          - cmsis
          - hal_nordic
          - hal_rpi_pico
          - hal_stm32
          - mbedtls
          - tinycrypt

  self:
    path: config
