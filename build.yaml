# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
#
# `artifact-name` is set explicitly on every target. Without it the name is
# derived from the board, and the HWMv2 board id `nice_nano@2.0.0//zmk` renders
# as `nice_nano@2.0.0__zmk` -- awkward to type and inconsistent with the
# `*-nice_nano_v2.uf2` names already used in firmware/ and the flashing docs.
# Setting it here keeps local builds (tools/build.sh) and the GitHub Actions
# artifacts on the same names.
---
include:
  - board: nice_nano@2.0.0//zmk
    shield: keyball39_left
    artifact-name: keyball39_left-nice_nano_v2
  - board: nice_nano@2.0.0//zmk
    shield: keyball39_right
    snippet: studio-rpc-usb-uart
    artifact-name: keyball39_right-nice_nano_v2
  # - board: nice_nano@2.0.0//zmk
  #   shield: settings_reset
  #   artifact-name: settings_reset-nice_nano_v2
